{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="position-relative d-flex align-items-center justify-content-center" style="height: 100vh;">

    <!-- Background Image -->
    <img src="{% static 'images/login_bg.jpg' %}"class="position-absolute w-100 h-100" style="top: 0; left: 0; object-fit: cover;" alt="Login Background">

    <!-- Dark Overlay -->
    <div class="position-absolute w-100 h-100 bg-dark" style="top: 0; left: 0; opacity: 0.5;"></div>

    <!-- Login Content -->
    <div class="container position-relative">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-9">
                <!-- LOGIN CARD -->
                <div class="card shadow-lg border-0 mt-5"
                     style="background-color: rgba(255, 255, 255, 0.88);">

                    <!-- HEADER -->
                    <div class="card-header bg-primary text-white text-center" style="background-color: rgba(0, 123, 255, 0.85) !important;">
                        <h3 class="mb-0">Login</h3>
                    </div>

                    <!-- BODY -->
                    <div class="card-body p-4">
                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group">
                                <label>Email or Phone</label>
                                <input type="text" name="username" class="form-control" placeholder="Enter Email or Phone" required>
                            </div>

                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block">Login</button>
                        </form>
                    </div>

                    <!-- FOOTER -->
                    <div class="card-footer text-center" style="background-color: rgba(255, 255, 255, 0.75);">
                        Don't have an account?
                        <a href="{% url 'register' %}">Register Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
