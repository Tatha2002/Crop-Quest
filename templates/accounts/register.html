{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="position-relative d-flex align-items-center justify-content-center" style="height: 100vh;">
    <!-- Background Image -->
    <img src="{% static 'images/login_bg.jpg' %}" class="position-absolute w-100 h-100" style="top: 0; left: 0; object-fit: cover;" alt="Registration Background">

    <!-- Dark Overlay -->
    <div class="position-absolute w-100 h-100 bg-dark" style="top: 0; left: 0; opacity: 0.5;"></div>

    <!-- Registration Content -->
    <div class="container position-relative">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10">

                <!-- REGISTRATION CARD -->
                <div class="card shadow-lg border-0 mt-5" style="background-color: rgba(255, 255, 255, 0.88);">
                    <!-- HEADER -->
                    <div class="card-header bg-success text-white text-center" style="background-color: rgba(40, 167, 69, 0.85) !important;">
                        <h3 class="mb-0">User Registration</h3>
                    </div>

                    <!-- BODY -->
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="Enter Email Address" required>
                            </div>

                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" name="phone" class="form-control" placeholder="Enter Phone Number" required>
                            </div>

                            <div class="form-group">
                                <label>Select Role</label>
                                <select name="role" class="form-control" required>
                                    <option value="">Choose Role</option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="USER">USER</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                            </div>

                            <div class="form-group">
                                <label>Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
                            </div>

                            <button type="submit" class="btn btn-success btn-block">Register</button>
                        </form>
                    </div>

                    <!-- FOOTER -->
                    <div class="card-footer text-center" style="background-color: rgba(255, 255, 255, 0.75);">
                        Already have an account?
                        <a href="{% url 'login' %}">Login Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
{% endblock %}
