{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="position-relative d-flex align-items-center justify-content-center py-5" style="min-height: 100vh;">
    <img src="{% static 'images/yield_bg.jpg' %}" class="position-absolute w-100 h-100" style="top: 0; left: 0; object-fit: cover;" alt="Agriculture">
    
    <div class="container position-relative">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-11">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">

                        <h1 class="text-center text-success font-weight-bold mb-4">Yield Prediction</h1>

                        <form id="yieldPredictionForm" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            <div class="form-row mb-3">

                                <!-- Soil Type -->
                                <div class="col-md-4 mb-3">
                                    <label for="soil_type" class="font-weight-bold">Soil Type</label>
                                    <select id="soil_type" name="soil_type" class="form-control" required>
                                        <option value="" disabled selected>Select Soil Type</option>
                                        {% for soil in soil_types %}
                                            <option value="{{ soil }}">{{ soil }}</option>
                                        {% endfor %}
                                    </select>
                                    <div id="soil_type_error" class="text-danger small mt-1" style="font-size: 14px;"></div>
                                </div>

                                <!-- Crop Type -->
                                <div class="col-md-4 mb-3">
                                    <label for="crop_type" class="font-weight-bold">Crop Type</label>
                                    <select id="crop_type" name="crop_type" class="form-control" required>
                                        <option value="" disabled selected>Select Crop Type</option>
                                        {% for crop in crop_types %}
                                            <option value="{{ crop }}">{{ crop }}</option>
                                        {% endfor %}
                                    </select>
                                    <div id="crop_type_error" class="text-danger small mt-1" style="font-size: 14px;"></div>
                                </div>

                                <!-- Season -->
                                <div class="col-md-4 mb-3">
                                    <label for="season" class="font-weight-bold">Season</label>
                                    <select id="season" name="season" class="form-control" required>
                                        <option value="" disabled selected>Select Season</option>
                                        {% for season in season_types %}
                                            <option value="{{ season }}">{{ season }}</option>
                                        {% endfor %}
                                    </select>
                                    <div id="season_error" class="text-danger small mt-1" style="font-size: 14px;"></div>
                                </div>

                            </div>

                            <!-- Temperature, Humidity, Rainfall -->
                            <div class="form-row mb-3">

                                <!-- Temperature -->
                                <div class="col-md-4 mb-3">
                                    <label for="temperature" class="font-weight-bold">Temperature</label>
                                    <input type="number" step="0.01" id="temperature" name="temperature" placeholder="Enter Temperature in °C" class="form-control" required>
                                    <div id="temperature_error" class="text-danger small mt-1" style="font-size: 14px;"></div>
                                </div>

                                <!-- Humidity -->
                                <div class="col-md-4 mb-3">
                                    <label for="humidity" class="font-weight-bold">Humidity</label>
                                    <input type="number" step="0.01" id="humidity" name="humidity" placeholder="Enter Humidity in %" class="form-control" required>
                                    <div id="humidity_error" class="text-danger small mt-1" style="font-size: 14px;"></div>
                                </div>

                                <!-- Rainfall -->
                                <div class="col-md-4 mb-3">
                                    <label for="rainfall" class="font-weight-bold">Rainfall</label>
                                    <input type="number" step="0.01" id="rainfall" name="rainfall" placeholder="Enter Rainfall in mm" class="form-control" required>
                                    <div id="rainfall_error" class="text-danger small mt-1" style="font-size: 14px;"></div>
                                </div>

                            </div>

                            <!-- Submit Button -->
                            <div class="text-center mt-2">
                                <button type="submit" id="yieldPredictionBtn" class="btn btn-success btn-lg">Get Prediction</button>
                            </div>

                        </form>

                        <!-- Yield Result -->
                        <div id="yield-result" class="text-center mt-4" style="display: none;">

                            <div class="d-inline-block px-4 py-3 rounded shadow-sm"
                                style="background-color: #f0f8f0; border: 2px solid #28a745;">
                                <div class="text-muted font-weight-bold">PREDICTED CROP YIELD</div>
                                <div id="yield-value" class="text-success font-weight-bold" style="font-size: 32px;"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
